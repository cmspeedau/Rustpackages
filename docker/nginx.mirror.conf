# nginx config for the mpkg mirror: serve index.toml and .mpk files,
# with long cache for immutable package files and no-cache for the index
# (so `mpkg update` always sees the latest published set).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex on;

    location = /index.toml {
        add_header Cache-Control "no-cache";
    }

    location /pkgs/ {
        # .mpk files are immutable per name+version+sha256; cache aggressively.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
    }
}
