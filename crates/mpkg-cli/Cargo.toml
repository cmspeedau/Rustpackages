[package]
name = "mpkg"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cmspeedau/Rustpackages"

[dependencies]
mpkg-core = { path = "../mpkg-core" }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
