[package]
name = "mpkg"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cmspeedau/Rustpackages"

[dependencies]
mpkg-core = { path = "../mpkg-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }

# Repo/client dependencies
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
hex = "0.4"
base64 = "0.21"
walkdir = "2"

[[bin]]
name = "mpkg"
path = "src/main.rs"