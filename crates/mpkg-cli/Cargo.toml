[package]
name = "mpkg"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cmspeedau/Rustpackages"

[dependencies]
mpkg-core = { path = "../mpkg-core" }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde_json = "1"
semver = "1"

# Repo/client dependencies
hex = "0.4"
base64 = "0.21"
walkdir = "2"

[[bin]]
name = "mpkg"
path = "src/main.rs"