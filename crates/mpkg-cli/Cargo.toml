[package]
name = "mpkg-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line interface for the mpkg package manager"

[dependencies]
mpkg-core = { path = "../mpkg-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
