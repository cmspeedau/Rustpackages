[package]
name = "mpkg"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cmspeedau/Rustpackages"

[dependencies]
mpkg-core = { path = "../mpkg-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
walkdir = "2"
hex = "0.4"
base64 = "0.21"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
anyhow = "1"