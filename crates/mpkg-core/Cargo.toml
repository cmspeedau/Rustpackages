[package]
name = "mpkg-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cmspeedau/Rustpackages"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
base64 = "0.21"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
rand_core = "0.6"
semver = { version = "1", features = ["serde"] }
indexmap = "2"

[dev-dependencies]
tempfile = "3"