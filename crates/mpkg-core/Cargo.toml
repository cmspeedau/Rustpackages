[package]
name = "mpkg-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rootfs-agnostic core library for the Rustpackages package manager"
license = "MIT"

[features]
default = ["http"]
http = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
tar = "0.4"
zstd = "0.13"
ureq = { version = "2", features = ["tls"], optional = true }

[dev-dependencies]
tempfile = "3"
