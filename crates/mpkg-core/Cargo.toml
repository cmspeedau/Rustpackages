[package]
name = "mpkg-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cmspeedau/Rustpackages"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
walkdir = "2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

# Repo signing
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
base64 = "0.21"
rand_core = "0.6"

[dev-dependencies]
tempfile = "3"