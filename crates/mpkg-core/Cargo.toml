[package]
name = "mpkg-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cmspeedau/Rustpackages"

[features]
http = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
walkdir = "2"
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
base64 = "0.21"
rand = "0.8"
semver = { version = "1", features = ["serde"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"