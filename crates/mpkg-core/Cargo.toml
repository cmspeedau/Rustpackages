[package]
name = "mpkg-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rootfs-agnostic core of the mpkg package manager: manifests, .mpk archives, transactions, repos, resolution, signing"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tar = "0.4"
zstd = "0.13"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
semver = "1"
thiserror = "2"
ed25519-dalek = "2"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
